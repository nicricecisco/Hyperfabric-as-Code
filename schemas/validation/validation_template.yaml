fabrics:
  - name: required, string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
    description: string, max length 2000
    location: string, min length 3, max length 50, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
    address: string, max length 200
    city: string, max length 50, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
    country: string, max length 50, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
    topology: enum = ["MESH", "SPINE_LEAF"], default = "MESH"
    labels:
        string[], max length 120
    annotations:
      - dataType: enum = ["STRING", "INT32", "UINT32", "INT64", "UINT64", "DURATION", "TIME", "UUID"], default = "STRING"
        name: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, required if value is passed
        value: string, min length 1, max length 512, required if name is passed
    delete:
      vnis:
        - name: required, string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
      vrfs:
        - name: required, string, must follow format "Vrf-", 1 to 16 alphanumeric characters which cannot all be digits"
  
    nodes:
      - name: required, string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
        description: string, max length 2000
        location: string, min length 3, max length 50, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
        modelName: required, enum = ["HF6100-32D", "HF6100-60L4D"]
        roles: required, enum = ["LEAF", "SPINE", "SERVER"] 
        serialNumber: string, max length 50
        psuAirflows:
          - airflow: enum = ["AIRFLOW_TYPE_PORT_SIDE_INTAKE", "AIRFLOW_TYPE_PORT_SIDE_EXHAUST"], default = "AIRFLOW_TYPE_PORT_SIDE_INTAKE"
          - psuModel: string, max length 50
        labels: 
          string[], max length 120
        protected: boolean, default = false, set to true to prevent node from being altered during rollback sequence

        managementPorts:
          - name: string, pattern "eth_N" where N is between 0-8
            description: string, max length 2000
            configOrigin: enum = ["CONFIG_ORIGIN_CLOUD", "CONFIG_ORIGIN_DEVICE"], default = "CONFIG_ORIGIN_CLOUD"
            connectedState: enum = ["CONNECTED_STATE_NOT_CONNECTED", "CONNECTED_STATE_CONNECTED"], default = "CONNECTED_STATE_NOT_CONNECTED"
            ipv4ConfigType: enum = ["CONFIG_TYPE_STATIC", "CONFIG_TYPE_DHCP"], default = "CONFIG_TYPE_STATIC"
            ipv4Address: string, valid IPv4 address, required if ipv4ConfigType is "CONFIG_TYPE_STATIC"
            ipv4Gateway: string, valid IPv4 address, required if ipv4ConfigType is "CONFIG_TYPE_STATIC"
            ipv6ConfigType: enum = ["CONFIG_TYPE_STATIC", "CONFIG_TYPE_DHCP"], default = "CONFIG_TYPE_STATIC"
            ipv6Address: string, valid IPv6 address, required if ipv6ConfigType is "CONFIG_TYPE_STATIC"
            ipv6Gateway: string, valid IPv6 address, required if ipv6ConfigType is "CONFIG_TYPE_STATIC"
            dnsAddresses: 
              string[], valid IPv4 or IPv6 addresses
            proxyAddress: string, URI format
            proxyUsername: string, max length 120
            proxyPassword: string, max length 120
            enabled: boolean
            setProxyPassword: boolean
            cloudUrls:
              string[], URI format
            noProxy:
              string[], max length 120

        ports:
          - name: required, string, must match pattern "Ethernet1_N" in which N is between 1-64
            description: string, max length 2000
            mtu: integer, range 1500-9100, default 9100
            fec: string, set of {rs, none}, cannot be "none" based on node modelName + port name
            pluggable: string, max length 150, required if fec is rs
            forceCounter: integer, min 0, max 40000000
            speed: string, set of {1x40G(4), 1x100G(2), 1x100G(4), 1x200G(4), 1x400G} or set of {1x10G(1), 1x25G(1), 1x50G(1)} based on node modelName + port name, required if pluggable is passed and fec is rs
            enabled: boolean
            roles: enum = ["UNUSED_PORT", "FABRIC_PORT", "HOST_PORT", "ROUTED_PORT", "LAG_PORT"], default ["UNUSED PORT]
            linkDown: boolean
            vrfId: string, must match pattern "Default VRF" or "Vrf", optionally followed by a hyphen and 1–15 alphanumeric characters with a limit of 7 digits if no letters, required if roles is "ROUTED_PORT"
            ipv4Address: string[], required if roles is "ROUTED_PORT" and no ipv6Address, max two addresses
            ipv6Address: string[], required if roles is "ROUTED_PORT" and no ipv4Address, max two addresses
            stp:
              - bpduGuard: boolean, only used when VLAN is deployed on port
                enabled: boolean, only used when VLAN is deployed on port
                portFast: boolean, only used when VLAN is deployed on port
                rootGuard: boolean, only used when VLAN is deployed on port
                uplinkFast: boolean, only used when VLAN is deployed on port
            annotations:
              - dataType: enum = ["STRING", "INT32", "UINT32", "INT64", "UINT64", "DURATION", "TIME", "UUID"], default = "STRING"
                name: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, required if value is passed
                value: string, min length 1, max length 512, required if name is passed
            labels: 
              string[], max length 120
            

    
    connections:
      - description: string, max length 2000
        osType: enum = ["HYPER_FABRIC", "NEXUS", "IOS_XE", "IOS_XR", "LINUX", ...], default = "HYPER_FABRIC"
        pluggable: string, max length 150
        local:
          portName: required, string, predefined immutable Ethernet1_N where N is range 1-32 / 1-64
          nodeName: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, must match remote node name
        remote:
          portName: required, string, predefined immutable Ethernet1_N where N is range 1-32 / 1-64 based on node modelName 
          nodeName: required, string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, must not match local node name
        
    vnis:
      - name: required, string min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
        description: string, max length 2000
        vni: integer, range 2-6000000
        mtu: integer, range 1500-9100, default 9100
        vrfId: string, must follow format "Vrf", optionally followed by a hyphen and 1–15 alphanumeric characters with a limit of 7 digits if no letters
        svis:
          - enabled: boolean
            ipv4Addresses:
              string[], valid IPv4 addresses, max two addresses
            ipv6Addresses:
              string[], valid IPv6 addresses, max one address
        protected: boolean, default = false, set to true to prevent vni from being altered during rollback sequence
        members:
          - untagged: required, boolean, required and needs to be true if no vlanId is passed
            vlanId: integer, range 2-3600, required if untagged is false or untagged is not passed
            port:
              nodeName: required, string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
              portName: required, string, predefined immutable Ethernet1_N where N is range 1-32 / 1-64

    vrfs:
      - name: required, string, must follow format "Vrf", optionally followed by a hyphen and 1–15 alphanumeric characters with a limit of 7 digits if no letters
        description: string, max length 2000 
        enabled: true
        asn: integer, range 1-4294967294, not 23456 or 65535
        vni: integer, range 2-6000000
        labels: 
          string[], max length 120
        protected: boolean, default = false, set to true to prevent vrf from being altered during rollback sequence

        annotations:
          - dataType: enum = ["STRING", "INT32", "UINT32", "INT64", "UINT64", "DURATION", "TIME", "UUID"], default = "STRING"
            name: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, required if value is passed
            value: string, min length 1, max length 512, required if name value is passed
        staticRoutes:
          - name: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
            description: string, max length 2000
            enabled: boolean
            labels: 
              string[], max length 120
            annotations:
              - dataType: enum = ["STRING", "INT32", "UINT32", "INT64", "UINT64", "DURATION", "TIME", "UUID"], default = "STRING"
                name: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens, required if value is passed
                value: string, min length 1, max length 512, required if name is passed
            routes:
              - nodeId: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
                interface: string, min length 3, max length 120, accepted characters are letters, digits, hyphens and cannot start or end with a hyphen, cannot be only digits, and cannot be only hyphens
                preference: integer, range 1-255
                prefix: required, string, valid IPv4 or IPv6 address
                nextHop: string, valid IPv4 or IPv6 address, required if discard is false or not passed
                nextVrf: string, must match pattern "Default VRF" or follow format "Vrf", optionally followed by a hyphen and 1–15 alphanumeric characters with a limit of 7 digits if no letters, required if discard is false or not passed
                tag: enum = ["TAG_AMBER", "TAG_BLACK", "TAG_BLUE", "TAG_GREEN", "TAG_RED", "TAG_PURPLE", "TAG_YELLOW"], default = "TAG_AMBER", defaults and required to be "TAG_BLACK" if discard is true, cannot be "TAG_BLACK" if discard is false
                discard: boolean, default = false

    autocabling:
      - enabled: boolean, default = false must be true to enable autocabling, set to true if any of the following fields are passed, ignores all other fields if enabled is false
        pluggable: string, max length 150
        speed: string, set of {100, 200, 400} and accepts G at the end of any number, rejected if enabled is false
        length: enum = [short, medium, long]
        cablePreference: enum = ["DAC", "AOC", "Transceiver"]
        portType: enum = ["SFP", "SFP28" "QSFP28", "QSFP-DD"]


    




            
              
