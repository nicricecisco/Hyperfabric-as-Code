fabrics:
  - name: ""  # required, string
    description: ""
    location: ""
    address: ""
    city: ""
    country: ""
    topology: "MESH"  # enum: [MESH, SPINE_LEAF], default = MESH
    labels: []  # string list, write using dash with new line for each item
    annotations:
      - dataType: "STRING"         # enum = ["STRING", "INT32", "UNIT32", "INT64", "UINT64", "FLOAT", "DOUBLE", "BOOLEAN"], default = "STRING"
        name: "" 
        value: "" # string, min length 1, max length 512

    nodes:
      - name: ""  # required, string
        description: ""
        location: ""
        modelName: "HF6100-32D"  # required, enum: [HF6100-32D, HF6100-60L4D]
        roles: ["LEAF"]  # required, enum: [LEAF, SPINE, SERVER]
        serialNumber: ""
        psuAirflows:
          - airflow: "AIRFLOW_TYPE_PORT_SIDE_INTAKE"  # enum: [AIRFLOW_TYPE_PORT_SIDE_INTAKE, AIRFLOW_TYPE_PORT_SIDE_EXHAUST]
            psuModel: ""
        labels: [] 

        managementPorts:
          - name: ""  # required, string 
            description: ""
            configOrigin: "CONFIG_ORIGIN_CLOUD"  # enum: [CONFIG_ORIGIN_CLOUD, CONFIG_ORIGIN_DEVICE]
            connectedState: "CONNECTED_STATE_NOT_CONNECTED"  # enum: [CONNECTED_STATE_NOT_CONNECTED, CONNECTED_STATE_CONNECTED]
            ipv4ConfigType: "CONFIG_TYPE_STATIC"  # enum: [CONFIG_TYPE_STATIC, CONFIG_TYPE_DHCP], default = CONFIG_TYPE_STATIC
            ipv4Address: "" # ipv4 string, must be set if ipv4ConfigType is CONFIG_TYPE_STATIC
            ipv4Gateway: "" 
            ipv6ConfigType: "CONFIG_TYPE_STATIC"  # enum: [CONFIG_TYPE_STATIC, CONFIG_TYPE_DHCP], default = CONFIG_TYPE_STATIC
            ipv6Address: "" # ipv6 string, must be set if ipv6ConfigType is CONFIG_TYPE_STATIC
            ipv6Gateway: ""
            dnsAddresses: [] # ipv4 or ipv6 string list
            proxyAddress: "" # URL string
            proxyPassword: ""
            proxyUsername: ""
            enabled: false
            setProxyPassword: false
            cloudUrls: [] # URL string list
            noProxy: [] # string list

        ports:
          - name: ""  # required, string
            description: ""
            mtu: 9100  # integer, range 1500-9100
            fec: "none"  # enum: [rs, none]
            forceCounter: 0  
            pluggable: "" 
            speed: "1x100G4"  # enum: ["1x40G2", "1x100G2", "1x100G4", "1x200G2", "1x400G", ...]
            enabled: false
            roles: ["UNUSED_PORT"]  # enum: [UNUSED_PORT, FABRIC_PORT, HOST_PORT, ROUTED_PORT, LAG_PORT]
            linkDown: false # boolean, required if roles is not ["FABRIC_PORT", "LAG_PORT"]
            vrfId: "" # string, required if roles is "ROUTED_PORT"
            ipv4Address: "" # ipv4 string, this or ipv6Address required if roles is "ROUTED_PORT"
            ipv6Address: "" # ipv6 string, this or ipv4Address required if roles is "ROUTED_PORT"
            annotations:
              - dataType: "STRING"         
                name: "" 
                value: ""


    connections:
      - description: ""
        osType: "HYPER_FABRIC"  # enum: ["HYPER_FABRIC", "NEXUS", "IOS_XE", "IOS_XR", "LINUX", ...]
        pluggable: ""
        local:
          portName: ""  # required, string predefined immutable Ethernet1_[N] where N is range 1-32 / 1-64
          nodeName: ""  # required, string set of nodes in fabric
        remote:
          portName: ""  # required
          nodeName: ""  # required

    vnis:
      - name: ""  # required, string
        description: ""
        vni: 2  # integer, range 2-6000000
        mtu: 9100  # integer, range 1500-9100
        svis:
          - enabled: false
            ipv4Addresses: []
            ipv6Addresses: []
        members:
          - untagged: false
            vlanId: 2  # integer, range 2-3600
            port:
              nodeName: ""  # required
              portName: ""  # required

    vrfs:
      - name: ""  # required
        description: ""
        enabled: true
        asn: 65000  # integer
        vni: 2  # integer range 2-6000000
        labels: [] 
        annotations:
          - dataType: "STRING"         
            name: "" 
            value: ""
        staticroute:
          - name: ""  
            description: ""
            enabled: false
            labels: [] 
            annotations:
              - dataType: "STRING"         
                name: "" 
                value: ""
            routes:
              - nodeId: "" 
                interface: ""
                preference: 1  # integer, range 1-255
                prefix: ""  # IP string
                nextHop: ""  # IP string, required if discard is false
                nextVrf: ""
                tag: "TAG_AMBER"  # enum = ["TAG_AMBER", "TAG_BLACK", "TAG_BLUE", "TAG_GREEN", "TAG_RED", ...], default = "TAG_AMBER" sets to "TAG_BLACK" if discard is true
                discard: false
