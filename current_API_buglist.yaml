    updated: 2025-01-17T12:40:39.176-0600
    timeoriginalestimate: null
    description: "From a Webex description:\r\n\r\nWhen fabric is created via GUI\
      \ manually, and we add only Leaf switches, then Fabric topology is displayed\
      \ as \"mesh\", which is correct.\r\n\r\nBut if fabric is created via api, and\
      \ then, also via API, we add to the fabric two nodes with \"roles\": [\"LEAF\"\
      ], fabric topology is displayed by default as \"spine-leaf\", which is not correct.\r\
      \n\r\nTo change it to \"mesh\", We need to go to \"Edit fabric\", change number\
      \ of leafs to 0, and then back to 2.\r\n\r\n\xC2\_\r\n\r\nIt seems we currently\
      \ don't have an option to set topology type on API.\r\n\r\n[https://devnetapps.cisco.com/docs/hyperfabric/add-a-fabric-currently-only-one-fabric-permitted-per-call/]\r\
      \n\r\nI'm wondering if it's UI side issue that mistakenly set topology type\
      \ or we need an option to specify it."
    customfield_10011: '2|i1ca7g:'
