    updated: 2025-01-22T18:14:06.730-0600
    timeoriginalestimate: null
    description: "Changes/renames to the candidate object:\r\n * revisionId, createdBy,\
      \ createdAt, modifiedBy, modifiedAt should be moved into metadata like all other\
      \ endpoints\r\n * in candidate.reviews createdBy, createdAt should be moved\
      \ into metadata like all other endpoints\r\n * Rename needX to includeX to match\
      \ includeMetadata for consistency:\r\n ** needInactive -> includeInactive\r\n\
      \ ** needReviews -> includeReviews\r\n ** needEvents -> includeEvents\r\n\r\n\
      \xC2\_\r\n\r\nRemove fabricID and name from CommitFabricCandidateRequest POST/PUT\
      \ payload\r\n\r\n\xC2\_\r\n\r\nIssues in POST /fabrics/\\{fabricId}/candidates/\\\
      {name}:\r\n * Returned the wrong fabricId. Return the value passed to the API\
      \ and not the actual fabricId (i.e when name is provided name is returned not\
      \ actual fabricId)\r\n * The error returned when a wrong revisionId is passed\
      \ is missing errCode:\r\n{code:json}\r\n{\r\n    \"message\": \"the candidate\
      \ has more recent changes by other users\",\r\n    \"field\": \"fabricId\",\r\
      \n    \"value\": \"1066\",\r\n    \"status\": 409,\r\n    \"trackingId\": \"\
      169fc125-a355-41c3-9e3a-81b85b9541e2\"\r\n}\r\n{code}\r\n\r\n\xC2\_\r\n\r\n\
      Issues in PUT /fabrics/\\{fabricId}/candidates/\\{name}:\r\n * Returned the\
      \ wrong fabricId. Return the value passed to the API and not the actual fabricId\
      \ (i.e when name is provided name is returned not actual fabricId)\r\n\r\n\xC2\
      \_\r\n\r\nIssues in DEL /fabrics/\\{fabricId}/candidates/\\{name}:\r\n * The\
      \ error returned when no changes are present is unclear. 404 might be more appropriate:\r\
      \n{code:json}\r\n{\r\n    \"message\": \"the named candidate was not reverted\"\
      ,\r\n    \"field\": \"name\",\r\n    \"value\": \"default\",\r\n    \"status\"\
      : 400,\r\n    \"errCode\": \"ERR_CODE_INVALID_VALUE\",\r\n    \"trackingId\"\
      : \"e48eefa9-9e49-4dc2-ad05-e7190f4126b1\"\r\n}\r\n{code}"
    customfield_10011: '2|i1cchg:'
