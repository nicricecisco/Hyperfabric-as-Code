    updated: 2025-01-22T18:27:50.988-0600
    timeoriginalestimate: null
    description: "Move\xC2\_ /fabrics/\\{fabricId}/devices/\\{deviceId}/managementPorts\
      \ to /devices/\\{deviceId}/managementPorts to be able to support unbound devices.\r\
      \n * For bound devices, the result of\xC2\_ /fabrics/\\{fabricId}/devices/\\\
      {deviceId}/managementPorts would be identical to\xC2\_ /fabrics/\\{fabricId}/nodes/\\\
      {nodeId}/managementPorts or in progress of being identical.\r\n * The move will\
      \ allow users to query the value before binding, update the node configuration\
      \ and then bind.\r\n\r\nGET /fabrics/\\{fabricId}/devices/\\{deviceId}/managementPorts\
      \ does not work with deviceId but works with nodeId\r\n * Would also be good\
      \ to work with deviceName or nodeName"
