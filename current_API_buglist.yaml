    updated: 2024-07-18T16:25:01.247-0500
    timeoriginalestimate: null
    description: "In order for the UI to correctly process gRPC error messages it\
      \ needs a copy of the status.Status Protobuf message.\r\n\r\nThis message is\
      \ defined in the status.proto file and for the UI is part of the google-proto-files\
      \ node package distribution. UI team do not want to use that package since it\
      \ is old, not maintained and has bugs.\r\n\r\nSo, for now, a local copy of the\
      \ Status message is created in the protobuf/common/grpc.proto file.\r\n\r\n\
      Once the UI migrates away from gRPC to using REST this local copy can be removed.\r\
      \n\r\n\xC2\_\r\n\r\n[~accountid:712020:0c326609-3357-4c80-864f-057c014d369e]\xC2\
      \_"
