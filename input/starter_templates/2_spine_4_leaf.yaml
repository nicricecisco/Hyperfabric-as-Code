# A fabric template for a 2 spine 4 leaf topology with 6 nodes defined
fabrics:
  - name: your-fabric-name
    topology: SPINE_LEAF
    
    nodes:
      - name: Leaf01-your-fabric-name
        description: Leaf Switch 01
        modelName: HF6100-60L4D
        roles:
          - LEAF
      - name: Leaf02-your-fabric-name
        description: Leaf Switch 02
        modelName: HF6100-60L4D
        roles:
          - LEAF
      - name: Leaf03-your-fabric-name
        description: Leaf Switch 03
        modelName: HF6100-60L4D
        roles:
          - LEAF
      - name: Leaf04-your-fabric-name
        description: Leaf Switch 04
        modelName: HF6100-60L4D
        roles:
          - LEAF 
      - name: Spine01-your-fabric-name
        description: Spine Switch 01
        modelName: HF6100-32D
        roles:
          - SPINE
      - name: Spine02-your-fabric-name
        description: Spine Switch 02
        modelName: HF6100-32D
        roles:
          - SPINE

    autocabling:
      enabled: true
      pluggable: QDD-400-AOC10M