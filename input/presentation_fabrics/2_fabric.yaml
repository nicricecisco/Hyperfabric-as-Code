        vni: 1000
        enabled: true
        staticRoutes:
          - name: SR002
            enabled: true
            routes:
              - prefix: 14.10.10.0/24
                preference: 10
                discard: true
              - prefix: 15.10.10.0/24
                preference: 10
                discard: true