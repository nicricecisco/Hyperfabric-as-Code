fabrics:
  - name: from-python
    description: I am updated from python
    location: CA-95134
    address: 300 East Tasman Drive
    city: Milpitas
    country: US
    labels:
      - TAG_ONE
      - TAG_TWO
    topology: SPINE_LEAF
    autocabling:
      enabled: true
      pluggable: QDD-400-AOC10M
    
    nodes:
      - name: Leaf01
        description: Leaf Switch 01 updated again
        modelName: HF6100-32D
        roles:
          - LEAF
        labels:
          - TAG_ONE
      - name: Leaf02
        description: Leaf Switch 02
        modelName: HF6100-32D
        roles: 
          - LEAF
        location: sj01-1-101-AAA02
        protected: true
        managementPorts:
          - description: Management Ethernet Port Configuration
            ipv4Address: 10.10.10.1/24
            ipv4Gateway: 10.10.10.254
            ipv6Address: 2a02:1243:5687:0:9c09:2c7a:7c78:9ffc/33
            ipv6Gateway: 2a02:1243:5687:0:8d91:ba6b:b24d:9b41
            dnsAddresses:
              - 9.9.9.9
              - 8.8.8.8
            proxyAddress: https://10.10.1.10:8080
            proxyUsername: adminUser
            proxyPassword: ThisIsMyPassword
            enabled: true
            ipv4ConfigType: CONFIG_TYPE_STATIC
            ipv6ConfigType: CONFIG_TYPE_DHCP
            cloudUrls:
              - https://a.example.com
              - https://b.example.com
            configOrigin: CONFIG_ORIGIN_CLOUD
            setProxyPassword: true
            noProxy:
              - 10.0.0.5
              - 2001:db8:3333:4444:5555:6666:7777:8888/8
              - 68.0.0.0/8
              - 72.0.0.0/8
              - 172.0.0.1/8
              - .cisco.com
              - .local
        ports:
          - name: Ethernet1_5
            enabled: true
            roles: 
              - "HOST_PORT"
          - name: Ethernet1_6
            enabled: true
            roles: 
              - "HOST_PORT"
      - name: Leaf03
        description: Leaf Switch 03
        modelName: HF6100-32D
        poop: poo
        roles:
          - LEAF
        labels:
          - TAG_ONE
      - name: Leaf04
        description: Leaf Switch 04
        modelName: HF6100-32D
        roles:
          - LEAF
        labels:
          - TAG_ONE
      - name: Spine01
        description: Spine Switch 01
        modelName: HF6100-32D
        roles: 
          - SPINE

    connections:
      - local:
          portName: Ethernet1_16
          nodeName: Leaf01
        remote:
          portName: Ethernet1_16
          nodeName: Spine01
        pluggable: QDD-400-AOC10M
      - local:
          portName: Ethernet1_20
          nodeName: Leaf01
        remote:
          portName: Ethernet1_20
          nodeName: Spine01
    

